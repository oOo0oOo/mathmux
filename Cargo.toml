[package]
name = "mathmux"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Fast local Lean checks in isolated Git worktrees"
license = "MIT"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
notify = "8.2"
regex = "1.11"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = true
